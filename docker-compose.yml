services:
  support-app-api:
    container_name: support-app-api
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=support-appDb;User=sa;Password=YourStrong@Password1;TrustServerCertificate=True;MultipleActiveResultSets=True
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://seq:5341/ingest/otlp/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      - sqlserver
      - seq
    networks:
      - support-app-net
    restart: on-failure

  sqlserver:
    container_name: support-app-sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password1
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - support-app-net
    restart: always

  seq:
    image: datalust/seq:latest
    #container_name: seq
    volumes:
      - ./containers/seq:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      - support-app-net
    ports:
      - "5341:5341"
      - "8060:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    #container_name: prometheus
    volumes:
      - ./containers/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    networks:
      - support-app-net
    depends_on:
      - support-app-api
    restart: unless-stopped

volumes:
  sqlserver-data: {}

networks:
  support-app-net:
    driver: bridge
